name: Qt6 build and package

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        required: true
    outputs:
      artifact-ids:
        value: ${{ jobs.package.outputs.artifact-ids }}
      manifest-sha256:
        value: ${{ jobs.package.outputs.manifest-sha256 }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

# All source builds use the event commit in fresh hosted jobs. Only the pinned
# upstream slang binary is cached. Transfers between jobs are tar archives to
# preserve symlinks and executable bits.
env:
  VEDIT_CI_LOG_DIR: target/ci-logs
  VEDIT_QT6_BUILD_JOBS: '3'
  VEDIT_CONTAINER_USER: '1'
  VEDIT_BASE_IMAGE: docker.io/library/centos
  CENTOS_VAULT_BASE: https://vault.centos.org/7.9.2009
  SLANG_BUILD_IMAGE: docker.io/library/centos@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4

jobs:
  slang:
    name: Pinned slang dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/slang/out/slang
          key: qt6-slang-${{ runner.arch }}-${{ hashFiles('scripts/versions.env', 'build/slang/versions.env', 'build/slang/*.sh', 'build/slang/scripts/**', 'build/slang/patches/**') }}
      - name: Rebuild on cache miss and check the binary pin
        run: |
          export VEDIT_SLANG_EVIDENCE_DIR="$GITHUB_WORKSPACE/$VEDIT_CI_LOG_DIR/slang"
          if [[ ! -x build/slang/out/slang ]]; then
            bash build/slang/build.sh
          fi
          source scripts/versions.env
          printf '%s  build/slang/out/slang\n' "$SLANG_BIN_SHA256" | sha256sum --check --strict
          tar -cf "$RUNNER_TEMP/slang.tar" build/slang/out/slang
      - name: Save verified slang
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slang-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slang.tar
          if-no-files-found: error
          retention-days: 3

  rust:
    name: Rust services and C ABI
    needs: slang
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.slang.outputs.artifact-id }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Build and check Rust services
        run: |
          tar -xf "$RUNNER_TEMP/slang.tar"
          bash scripts/fetch-verible.sh
          bash scripts/build-qt.sh --rust-only
          bash scripts/ci-qt6.sh rust-gates
          tar -cf "$RUNNER_TEMP/ffi.tar" target/release/libvd_ffi.a crates/vd-ffi/include/vd_ffi.h
      - name: Save inspected C ABI inputs
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffi-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ffi.tar
          if-no-files-found: error
          retention-days: 3

  qt:
    name: Qt6 build and gates
    needs: [slang, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.slang.outputs.artifact-id }},${{ needs.rust.outputs.artifact-id }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Build product and run CTest, Xvfb and translation gates
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/slang.tar"
          tar -xf "$RUNNER_TEMP/ffi.tar"
          bash scripts/fetch-verible.sh
          bash scripts/ci-qt6.sh qt
      - name: Build F2 highlighting and collect package inputs
        if: inputs.package
        run: bash scripts/ci-qt6.sh f2
      - name: Save Qt6 package inputs
        if: inputs.package
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-package-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qt6.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Save Qt build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-build-logs-${{ github.run_attempt }}
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  scala:
    name: Offline Scala dependencies
    if: inputs.package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the pinned Scala payload and prewarm its offline caches
        run: |
          ROOT="$GITHUB_WORKSPACE" bash packaging/runtime/build-scala-payload.sh
          tar --zstd -cf "$RUNNER_TEMP/scala.tar.zst" packaging/runtime/out/scala-payload
      - name: Save the offline payload
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scala-payload-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scala.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  package:
    name: Qt6 release packages and CentOS 7 verification
    needs: [slang, qt, scala]
    if: inputs.package
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact-ids: >-
        ${{ steps.appimage.outputs.artifact-id }},${{ steps.tarball.outputs.artifact-id }},${{ steps.installer.outputs.artifact-id }},${{ steps.manifest.outputs.artifact-id }}
      manifest-sha256: ${{ steps.pack.outputs.manifest-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.slang.outputs.artifact-id }},${{ needs.qt.outputs.artifact-id }},${{ needs.scala.outputs.artifact-id }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Build and verify all three formats
        id: pack
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          tar -xf "$RUNNER_TEMP/slang.tar"
          rm -- "$RUNNER_TEMP/slang.tar"
          tar --zstd -xf "$RUNNER_TEMP/qt6.tar.zst"
          rm -- "$RUNNER_TEMP/qt6.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/scala.tar.zst"
          rm -- "$RUNNER_TEMP/scala.tar.zst"
          bash scripts/ci-qt6.sh package
      # Keep each already-compressed format in a separate streamed artifact.
      - name: Save verified AppImage
        id: appimage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-appimage-${{ github.sha }}-${{ github.run_attempt }}
          path: packaging/runtime/out/release/VEdit-${{ steps.pack.outputs.version }}-x86_64.AppImage
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save verified tarball
        id: tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-tarball-${{ github.sha }}-${{ github.run_attempt }}
          path: packaging/runtime/out/release/vedit-${{ steps.pack.outputs.version }}-linux-x86_64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save verified installer
        id: installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-installer-${{ github.sha }}-${{ github.run_attempt }}
          path: packaging/runtime/out/release/VEdit-${{ steps.pack.outputs.version }}-x86_64.run
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Save release checksums
        id: manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-manifest-${{ github.sha }}-${{ github.run_attempt }}
          path: packaging/runtime/out/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Save packaging logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qt6-packaging-logs-${{ github.run_attempt }}
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
