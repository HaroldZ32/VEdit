name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt6:
    name: Qt6 validation
    uses: ./.github/workflows/image.yml
    with:
      package: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' }}
