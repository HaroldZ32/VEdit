name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Check release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      tag-object: ${{ steps.check.outputs.tag-object }}
      notes-present: ${{ steps.check.outputs.notes-present }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the annotated version tag to be reachable from main
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash scripts/ci-qt6.sh version)
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"
          if [[ -f "docs/releases/$version.md" ]]; then
            echo 'notes-present=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
              echo "::error::Expected refs/tags/v$version for the workspace Cargo version"
              exit 1
            fi
            if [[ "$(git cat-file -t "$GITHUB_REF")" != tag ]]; then
              echo "::error::Use an annotated release tag"
              exit 1
            fi
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$commit"
            if ! git rev-list --first-parent --merges refs/remotes/origin/main | grep -Fx -- "$commit" >/dev/null; then
              echo "::error::The tagged commit must be on origin/main first-parent history"
              exit 1
            fi
            printf 'tag-object=%s\n' "$(git rev-parse "$GITHUB_REF")" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Validate and package Qt6
    needs: source
    uses: ./.github/workflows/image.yml
    with:
      package: true

  publish:
    name: Publish verified AppImage and SHA256SUMS
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/vedit-release
      - name: Check the transferred pair and publish the existing tag
        shell: bash
        working-directory: ${{ runner.temp }}/vedit-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.source.outputs.tag-object }}
          COMMIT: ${{ needs.source.outputs.commit }}
          VERSION: ${{ needs.source.outputs.version }}
          APPIMAGE: ${{ needs.build.outputs.appimage }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          NOTES_PRESENT: ${{ needs.source.outputs.notes-present }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          test "$APPIMAGE" = "VEdit-$VERSION-x86_64.AppImage"
          [[ "$SHA256" =~ ^[a-f0-9]{64}$ ]]
          shopt -s dotglob nullglob
          files=(*)
          test "${#files[@]}" -eq 2
          test -f "$APPIMAGE" && test ! -L "$APPIMAGE"
          test -f SHA256SUMS && test ! -L SHA256SUMS
          printf '%s  %s\n' "$SHA256" "$APPIMAGE" | cmp - SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$TAG_OBJECT"

          notes=(--generate-notes)
          note_path="docs/releases/$VERSION.md"
          if [[ "$NOTES_PRESENT" == true ]]; then
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GH_REPO/contents/$note_path?ref=$COMMIT" > "$RUNNER_TEMP/release-notes.md"
            notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          if [[ "$VERSION" == *-* ]]; then notes+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "VEdit $VERSION" \
            "${notes[@]}" "$APPIMAGE" SHA256SUMS
