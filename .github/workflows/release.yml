name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Check release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      tag-object: ${{ steps.check.outputs.tag-object }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an annotated version tag on a main merge
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version=$(bash scripts/ci-qt6.sh version)
          commit=$(git rev-parse HEAD)
          test "$commit" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          printf 'version=%s\ncommit=%s\n' "$version" "$commit" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
              echo "::error::Expected refs/tags/v$version for the workspace Cargo version"
              exit 1
            fi
            if [[ "$(git cat-file -t "$GITHUB_REF")" != tag ]]; then
              echo "::error::Use an annotated release tag"
              exit 1
            fi
            test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$commit"
            if ! git rev-list --first-parent --merges refs/remotes/origin/main | grep -Fx -- "$commit" >/dev/null; then
              echo "::error::The tagged commit must be on origin/main first-parent history"
              exit 1
            fi
            printf 'tag-object=%s\n' "$(git rev-parse "$GITHUB_REF")" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Validate and package Qt6
    needs: source
    uses: ./.github/workflows/image.yml
    with:
      package: true

  publish:
    name: Publish verified packages and SHA256SUMS
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Record publisher disk space before transfer
        run: df -h "$RUNNER_TEMP"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-ids }}
          path: ${{ runner.temp }}/vedit-release
          merge-multiple: true
      - name: Check transferred names, sizes and checksums
        shell: bash
        env:
          RELEASE_DIR: ${{ runner.temp }}/vedit-release
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          test "$(bash scripts/ci-qt6.sh version)" = "$VERSION"
          [[ "$MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$MANIFEST_SHA256" "$RELEASE_DIR/SHA256SUMS" | sha256sum --check --strict
          asset_metadata="$RUNNER_TEMP/vedit-release-assets.tsv"
          bash scripts/ci-qt6.sh release-assets "$RELEASE_DIR" > "$asset_metadata"
          LC_ALL=C sort -o "$asset_metadata" "$asset_metadata"
          cat "$asset_metadata"
      - name: Check all four uploaded assets before publishing the draft
        shell: bash
        env:
          RELEASE_DIR: ${{ runner.temp }}/vedit-release
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ needs.source.outputs.tag-object }}
          COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          test "$TAG" = "v$VERSION"
          test -n "$TAG_OBJECT"
          remote_tag() { gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha'; }
          test "$(remote_tag)" = "$TAG_OBJECT"
          release_api="repos/$GH_REPO/releases"
          existing=$(gh api --paginate "$release_api?per_page=100" |
            jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id')
          if [[ -n "$existing" ]]; then
            echo "::error::A release or draft already exists for $TAG (ID $existing)"
            exit 1
          fi

          notes=(--generate-notes)
          if [[ -f "docs/releases/$VERSION.md" ]]; then
            notes=(--notes-file "docs/releases/$VERSION.md")
          fi
          if [[ "$VERSION" == *-* ]]; then notes+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --target "$COMMIT" --title "VEdit $VERSION" \
            "${notes[@]}" "$RELEASE_DIR/VEdit-$VERSION-x86_64.AppImage" \
            "$RELEASE_DIR/vedit-$VERSION-linux-x86_64.tar.gz" "$RELEASE_DIR/VEdit-$VERSION-x86_64.run" \
            "$RELEASE_DIR/SHA256SUMS"
          release_id=$(gh release view "$TAG" --json isDraft,databaseId --jq 'select(.isDraft) | .databaseId')
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api --paginate "$release_api/$release_id/assets" |
            jq -r '.[] | [.name, .size, (if .state == "uploaded" then .digest else .state end)] | @tsv' |
            LC_ALL=C sort | diff -u "$RUNNER_TEMP/vedit-release-assets.tsv" -
          test "$(remote_tag)" = "$TAG_OBJECT"
          gh api --method PATCH "$release_api/$release_id" -F draft=false --jq .html_url
